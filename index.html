<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6e9"><title>Ucapan Spesial</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{width:100%;height:100dvh;display:grid;place-items:center;background:#111}.phone{height:100dvh;aspect-ratio:576/1024;max-width:100vw;position:relative;overflow:hidden;background:#fff6e9}.phone video{width:100%;height:100%;object-fit:cover;display:block}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#ffffffcc;color:#7c5b57;font-size:12px;backdrop-filter:blur(8px);box-shadow:0 4px 18px #0001;white-space:nowrap}.hint.hide{opacity:0;pointer-events:none;transition:.4s}</style></head><body><main class="stage"><div class="phone"><video id="v" src="reference.mp4" autoplay muted playsinline loop></video><div id="hint" class="hint">Tap untuk suara ♡</div></div></main><script>const v=document.getElementById('v'),h=document.getElementById('hint');document.querySelector('.phone').addEventListener('click',()=>{v.muted=!v.muted;if(!v.muted)v.play();h.classList.add('hide')},{once:false});</script></body></html>
